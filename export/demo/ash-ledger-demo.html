<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>دفتر خاکستر — دمو</title>
<style>
@font-face {
  font-family: Vazirmatn;
  src: url("Vazirmatn-Regular.ttf") format("truetype");
  font-weight: 400;
}
@font-face {
  font-family: Vazirmatn;
  src: url("Vazirmatn-Bold.ttf") format("truetype");
  font-weight: 700;
}
:root {
  --bg: #1a1614; --bg-deep: #120f0e; --ash: #8a7f74; --ash-light: #b8aea3;
  --amber: #e8a04a; --ember: #c45c3e; --cream: #f0d9a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg-deep); color: var(--cream);
  font-family: Vazirmatn, Tahoma, sans-serif; overflow: hidden; touch-action: none;
}
#wrap {
  max-width: 420px; height: 100%; margin: 0 auto; position: relative;
  background: radial-gradient(ellipse at 50% 25%, #3a2a1c 0%, var(--bg) 45%, var(--bg-deep) 100%);
}
canvas { display: block; width: 100%; height: 100%; }
.panel {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center; padding: 24px 24px 36px;
  gap: 12px; background: linear-gradient(180deg, rgba(18,15,14,.25) 0%, rgba(18,15,14,.92) 48%);
  text-align: center; z-index: 5;
}
.panel.hidden { display: none; }
.panel.center { justify-content: center; background: rgba(18,15,14,.94); }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: 0; color: var(--cream); }
.tag { color: var(--ash-light); font-size: .95rem; line-height: 1.6; max-width: 300px; }
.online-note {
  font-size: .8rem; color: var(--amber); background: rgba(232,160,74,.12);
  border: 1px solid rgba(232,160,74,.35); border-radius: 10px; padding: 10px 12px; max-width: 320px; line-height: 1.5;
}
button {
  border: none; background: var(--amber); color: #1a1208; font-family: inherit;
  font-weight: 700; font-size: 1rem; padding: 14px 28px; border-radius: 10px;
  cursor: pointer; min-width: 210px;
}
button.ghost { background: transparent; color: var(--ash-light); border: 1px solid var(--ash); }
.story-body {
  color: var(--ash-light); font-size: 1.05rem; line-height: 1.75;
  text-align: right; max-width: 340px; min-height: 110px;
}
.choice-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
.hud {
  position: absolute; top: 14px; inset-inline: 14px; z-index: 3; pointer-events: none;
}
.hud .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: .85rem; color: var(--ash-light); }
.bar { height: 11px; background: #2a2420; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
.bar > i { display: block; height: 100%; width: 100%; transform-origin: right center; }
.hp > i { background: linear-gradient(90deg, #8a3a2a, var(--ember)); }
.xp > i { background: linear-gradient(90deg, #a86f2e, var(--amber)); height: 7px; }
.levelup {
  position: absolute; inset: 0; z-index: 4; background: rgba(10,8,7,.88);
  display: none; flex-direction: column; justify-content: center; align-items: center;
  gap: 14px; padding: 20px;
}
.levelup.show { display: flex; }
.cards { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
.card {
  background: linear-gradient(135deg, #2a221c, #1a1614); border: 1px solid var(--amber);
  color: var(--cream); border-radius: 12px; padding: 14px; text-align: right;
  cursor: pointer; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.card small { color: var(--ash-light); display: block; margin-top: 4px; }
.hint {
  position: absolute; bottom: 16px; inset-inline: 0; text-align: center;
  color: var(--ash); font-size: .78rem; z-index: 3; pointer-events: none;
}
.portrait {
  width: min(70vw, 280px); height: min(70vw, 280px); object-fit: cover;
  border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
  border: 1px solid rgba(232,160,74,.25); margin-bottom: 8px;
}
</style>
</head>
<body>
<div id="wrap">
  <div class="hud" id="hud" style="display:none">
    <div class="row"><span id="timer">۰:۴۵</span><span id="lv">سطح ۱</span></div>
    <div class="bar hp"><i id="hpFill"></i></div>
    <div class="bar xp"><i id="xpFill" style="height:7px"></i></div>
  </div>
  <canvas id="game" width="420" height="760"></canvas>
  <div class="hint" id="hint" style="display:none">بکشید یا WASD · شلیک خودکار است</div>
  <div class="levelup" id="levelup">
    <h2>یک اخگر انتخاب کنید</h2>
    <div class="cards" id="cards"></div>
  </div>

  <div class="panel" id="menu">
    <img class="portrait" src="hero.png" alt="نگهبان خاکستر" />
    <h1>دفتر خاکستر</h1>
    <p class="tag">شب را تاب بیاور. صفحه را ورق بزن.</p>
    <p class="online-note">این دمو وب، تک‌نفره و برای حس بازی است. کوآپ آنلاین ۲–۴ نفره در نسخهٔ Godot (میزبانی / پیوستن) فعال است.</p>
    <button id="btnPlay">شروع بقا</button>
  </div>

  <div class="panel center hidden" id="story">
    <h1 style="font-size:1.45rem" id="storyTitle">نخستین نشان</h1>
    <p class="tag" id="storySetting" style="color:var(--amber)"></p>
    <p class="story-body" id="storyBody"></p>
    <div class="choice-row" id="storyChoices"></div>
    <button id="storyNext">ادامه</button>
  </div>

  <div class="panel center hidden" id="end">
    <h1 style="font-size:1.5rem" id="endTitle">فصل نگه داشته شد</h1>
    <p class="tag" id="endSub"></p>
    <button id="endBtn">ادامه</button>
    <button class="ghost" id="endReplay">یک شب دیگر</button>
  </div>
</div>
<script>
(() => {
  const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const imgHero = new Image(); imgHero.src = "hero.png";
  const imgEnemy = new Image(); imgEnemy.src = "enemy.png";
  const imgBoss = new Image(); imgBoss.src = "boss.png";

  const menu = document.getElementById("menu");
  const story = document.getElementById("story");
  const end = document.getElementById("end");
  const hud = document.getElementById("hud");
  const hint = document.getElementById("hint");
  const levelup = document.getElementById("levelup");
  const cards = document.getElementById("cards");

  const CHAPTER = {
    title: "نخستین نشان",
    setting: "برج دیده‌بانی ویران روی دشت خاکستر، پس از غروب.",
    beats: [
      { type: "narration", text: "با دوده زیر ناخن‌ها بیدار می‌شوی و دفتری باز روی زانوهایت. آخرین سطر با خطی شبیه خط خودت نوشته شده — اما نوشتنش را به یاد نمی‌آوری." },
      { type: "narration", text: "بیرون، شکل‌هایی در خاکستری حرکت می‌کنند. حرف نمی‌زنند. فقط وقتی باد می‌خوابد نزدیک‌تر می‌شوند." },
      { type: "choice", prompt: "اول چه چیزی را در مشت می‌گیری؟", options: ["دفتر", "اخگری نیمه‌جان"] },
      { type: "narration", text: "هرچه انتخاب کردی کف دستت را گرم می‌کند. تا پاک شدن نشان زنده بمان — آن‌وقت دفتر دوباره حرف می‌زند." },
    ],
  };

  const UPGRADES = [
    { id: "fire", title: "اخگر تند", desc: "شلیک سریع‌تر.", apply: p => p.fireRate *= 0.82 },
    { id: "dmg", title: "خاکستر داغ‌تر", desc: "گلوله‌ها قوی‌تر می‌زنند.", apply: p => p.damage *= 1.25 },
    { id: "orbit", title: "حلقهٔ اخگر", desc: "دشمنان نزدیک را می‌سوزاند.", apply: p => { p.orbit = true; p.orbitDmg *= 1.15; } },
    { id: "multi", title: "جرقهٔ شکافته", desc: "پرتابهٔ اضافه.", apply: p => p.shots = Math.min(p.shots + 1, 5) },
    { id: "hp", title: "قلب سنگی", desc: "جان بیشینه بیشتر.", apply: p => { p.maxHp += 25; p.hp += 25; } },
  ];

  let mode = "menu", player, enemies, bullets, orbs, particles, keys, pointer;
  let elapsed, duration, spawnCd, bossSpawned, beatIndex, paused, last = performance.now();

  function resetRun() {
    player = { x: W/2, y: H*.55, r: 18, speed: 215, hp: 100, maxHp: 100, xp: 0, next: 18, level: 1,
      damage: 14, fireRate: .4, fireCd: 0, shots: 1, orbit: false, orbitDmg: 12, orbitA: 0, hurtCd: 0, bob: 0 };
    enemies = []; bullets = []; orbs = []; particles = [];
    elapsed = 0; duration = 45; spawnCd = .35; bossSpawned = false; paused = false;
    keys = {}; pointer = { active: false, x: 0, y: 0, ox: 0, oy: 0 };
  }

  const show = el => el.classList.remove("hidden");
  const hide = el => el.classList.add("hidden");

  function startRun() {
    resetRun(); mode = "run"; hide(menu); hide(story); hide(end);
    levelup.classList.remove("show"); hud.style.display = "block"; hint.style.display = "block";
  }
  function startStory() {
    mode = "story"; beatIndex = 0; hud.style.display = "none"; hint.style.display = "none";
    hide(end); show(story);
    document.getElementById("storyTitle").textContent = CHAPTER.title;
    document.getElementById("storySetting").textContent = CHAPTER.setting;
    renderBeat();
  }
  function renderBeat() {
    const choices = document.getElementById("storyChoices");
    const next = document.getElementById("storyNext");
    choices.innerHTML = "";
    const beat = CHAPTER.beats[beatIndex];
    if (!beat) { hide(story); show(menu); mode = "menu"; return; }
    if (beat.type === "narration") {
      document.getElementById("storyBody").textContent = beat.text; next.style.display = "block";
    } else {
      document.getElementById("storyBody").textContent = beat.prompt; next.style.display = "none";
      beat.options.forEach(opt => {
        const b = document.createElement("button"); b.className = "ghost"; b.textContent = opt;
        b.onclick = () => { beatIndex++; renderBeat(); }; choices.appendChild(b);
      });
    }
  }

  document.getElementById("btnPlay").onclick = startRun;
  document.getElementById("storyNext").onclick = () => { beatIndex++; renderBeat(); };
  document.getElementById("endBtn").onclick = () => {
    if (document.getElementById("endBtn").dataset.win === "1") startStory();
    else { hide(end); show(menu); mode = "menu"; }
  };
  document.getElementById("endReplay").onclick = startRun;
  window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
  window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

  canvas.addEventListener("pointerdown", e => {
    if (mode !== "run" || paused) return;
    const rect = canvas.getBoundingClientRect();
    const sx = W/rect.width, sy = H/rect.height;
    pointer.active = true;
    pointer.ox = (e.clientX - rect.left) * sx; pointer.oy = (e.clientY - rect.top) * sy;
    pointer.x = pointer.ox; pointer.y = pointer.oy;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!pointer.active) return;
    const rect = canvas.getBoundingClientRect();
    const sx = W/rect.width, sy = H/rect.height;
    pointer.x = (e.clientX - rect.left) * sx; pointer.y = (e.clientY - rect.top) * sy;
  });
  canvas.addEventListener("pointerup", () => { pointer.active = false; });

  function moveDir() {
    let dx = 0, dy = 0;
    if (keys.w || keys.arrowup) dy -= 1;
    if (keys.s || keys.arrowdown) dy += 1;
    if (keys.a || keys.arrowleft) dx -= 1;
    if (keys.d || keys.arrowright) dx += 1;
    if (pointer.active) {
      const vx = pointer.x - pointer.ox, vy = pointer.y - pointer.oy;
      const len = Math.hypot(vx, vy) || 1;
      if (len > 8) { dx = vx / len; dy = vy / len; }
    }
    const l = Math.hypot(dx, dy) || 1;
    return { x: dx/l, y: dy/l, moving: dx || dy };
  }

  function nearestEnemy() {
    let best = null, bd = 1e9;
    for (const e of enemies) {
      const d = (e.x-player.x)**2 + (e.y-player.y)**2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function spawnEnemy(boss=false) {
    const a = Math.random()*Math.PI*2, rad = 230+Math.random()*130;
    enemies.push({
      x: Math.min(W-24, Math.max(24, player.x + Math.cos(a)*rad)),
      y: Math.min(H-24, Math.max(24, player.y + Math.sin(a)*rad)),
      r: boss ? 34 : 16, hp: boss ? 260 : 26+elapsed*.7, speed: boss ? 68 : 78+elapsed*.85,
      dmg: boss ? 18 : 10, xp: boss ? 30 : 3, boss, scale: .15, wobble: Math.random()*10
    });
  }

  function addXp(n) {
    player.xp += n;
    while (player.xp >= player.next) {
      player.xp -= player.next; player.level++; player.next = 16 + player.level*10; openLevelUp();
    }
  }

  function openLevelUp() {
    mode = "levelup"; paused = true; levelup.classList.add("show");
    const pool = [...UPGRADES].sort(() => Math.random()-.5).slice(0,3);
    cards.innerHTML = "";
    pool.forEach(u => {
      const el = document.createElement("div"); el.className = "card";
      el.innerHTML = `<strong>${u.title}</strong><small>${u.desc}</small>`;
      el.onclick = () => { u.apply(player); levelup.classList.remove("show"); paused = false; mode = "run"; };
      cards.appendChild(el);
    });
  }

  function endRun(win) {
    mode = "end"; paused = true; hud.style.display = "none"; hint.style.display = "none"; show(end);
    document.getElementById("endTitle").textContent = win ? "فصل نگه داشته شد" : "خاکستر فرو نشست";
    document.getElementById("endSub").textContent = win ? "صفحه ورق می‌خورد. داستان منتظر است." : "افتادی. یک شب دیگر را امتحان کن.";
    const btn = document.getElementById("endBtn");
    btn.textContent = win ? "خواندن دفتر" : "بازگشت";
    btn.dataset.win = win ? "1" : "0";
  }

  function burst(x,y,color,n=10) {
    for (let i=0;i<n;i++) {
      const a = Math.random()*Math.PI*2, sp = 50+Math.random()*90;
      particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:.5, color, size:2+Math.random()*3 });
    }
  }

  function drawSprite(img, x, y, size, bob=0) {
    if (!img.complete || !img.naturalWidth) return false;
    const s = size;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6;
    ctx.beginPath(); ctx.ellipse(x, y + s*.42, s*.34, s*.12, 0, 0, Math.PI*2);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.drawImage(img, x - s/2, y - s/2 + bob, s, s);
    ctx.restore();
    return true;
  }

  function update(dt) {
    if (mode !== "run" || paused) return;
    elapsed += dt;
    const left = Math.max(0, duration - elapsed);
    document.getElementById("timer").textContent = `${fa(Math.floor(left/60))}:${fa(String(Math.floor(left%60)).padStart(2,"0"))}`;
    document.getElementById("lv").textContent = `سطح ${fa(player.level)}`;
    document.getElementById("hpFill").style.transform = `scaleX(${player.hp/player.maxHp})`;
    document.getElementById("xpFill").style.transform = `scaleX(${player.xp/player.next})`;

    const dir = moveDir();
    if (dir.moving) { player.x += dir.x*player.speed*dt; player.y += dir.y*player.speed*dt; }
    player.x = Math.max(22, Math.min(W-22, player.x));
    player.y = Math.max(22, Math.min(H-22, player.y));
    player.hurtCd = Math.max(0, player.hurtCd - dt);
    player.fireCd -= dt; player.orbitA += dt*3.3; player.bob += dt*6;

    spawnCd -= dt;
    if (spawnCd <= 0) {
      for (let i=0;i<1+Math.floor(elapsed/12);i++) spawnEnemy(false);
      spawnCd = Math.max(.32, .95 - elapsed*.015);
    }
    if (!bossSpawned && elapsed >= duration*.7) { spawnEnemy(true); bossSpawned = true; burst(player.x, player.y-90, "#c45c3e", 22); }
    if (elapsed >= duration) { endRun(true); return; }

    const target = nearestEnemy();
    if (target && player.fireCd <= 0) {
      player.fireCd = player.fireRate;
      const base = Math.atan2(target.y-player.y, target.x-player.x);
      for (let i=0;i<player.shots;i++) {
        const spread = player.shots===1 ? 0 : (-.25 + .5*(i/(player.shots-1)));
        const a = base + spread;
        bullets.push({ x: player.x+Math.cos(a)*20, y: player.y+Math.sin(a)*20, vx:Math.cos(a)*450, vy:Math.sin(a)*450, life:1.2, dmg:player.damage });
      }
    }

    for (const b of bullets) { b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; }
    bullets = bullets.filter(b => b.life > 0);

    for (const e of enemies) {
      e.scale = Math.min(1, e.scale + dt*3.5); e.wobble += dt*4;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      e.x += Math.cos(a)*e.speed*dt; e.y += Math.sin(a)*e.speed*dt;
      const d = Math.hypot(e.x-player.x, e.y-player.y);
      if (d < e.r+player.r && player.hurtCd <= 0) {
        player.hp -= e.dmg; player.hurtCd = .35; burst(player.x, player.y, "#c45c3e", 8);
        if (player.hp <= 0) { endRun(false); return; }
      }
      if (player.orbit && d < 58) e.hp -= player.orbitDmg*dt;
    }

    for (const b of bullets) for (const e of enemies) {
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.r+7) { e.hp -= b.dmg; b.life = 0; burst(e.x, e.y, "#e8a04a", 6); }
    }
    for (const e of enemies.filter(x => x.hp <= 0)) {
      orbs.push({ x:e.x, y:e.y, xp:e.xp }); burst(e.x, e.y, e.boss ? "#c45c3e" : "#8a7f74", e.boss ? 24 : 10);
    }
    enemies = enemies.filter(e => e.hp > 0);

    for (const o of orbs) {
      const d = Math.hypot(o.x-player.x, o.y-player.y);
      if (d < 100) { const a = Math.atan2(player.y-o.y, player.x-o.x); o.x += Math.cos(a)*400*dt; o.y += Math.sin(a)*400*dt; }
      if (d < 18) { addXp(o.xp); o.dead = true; }
    }
    orbs = orbs.filter(o => !o.dead);

    for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; p.vx *= .9; p.vy *= .9; }
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    const g = ctx.createRadialGradient(W*.5, H*.35, 40, W*.5, H*.5, 420);
    g.addColorStop(0, "rgba(58,42,28,.55)"); g.addColorStop(1, "rgba(18,15,14,0)");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "rgba(138,127,116,.14)";
    for (let i=0;i<40;i++) {
      ctx.beginPath(); ctx.arc((i*97)%W, (i*53)%H, 1.4, 0, Math.PI*2); ctx.fill();
    }
    if (mode !== "run" && mode !== "levelup") return;

    for (const o of orbs) {
      ctx.fillStyle = "#e8a04a"; ctx.shadowColor = "#e8a04a"; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(o.x, o.y-7); ctx.lineTo(o.x+6, o.y); ctx.lineTo(o.x, o.y+7); ctx.lineTo(o.x-6, o.y); ctx.fill();
      ctx.shadowBlur = 0;
    }
    for (const b of bullets) {
      ctx.fillStyle = "#e8a04a"; ctx.shadowColor = "#e8a04a"; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    }
    for (const e of enemies) {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.scale, e.scale); ctx.rotate(Math.sin(e.wobble)*.08);
      const ok = drawSprite(e.boss ? imgBoss : imgEnemy, 0, 0, e.boss ? 92 : 56, Math.sin(e.wobble)*2);
      if (!ok) {
        ctx.fillStyle = e.boss ? "#c45c3e" : "#8a7f74";
        ctx.beginPath(); ctx.moveTo(-16,-12); ctx.lineTo(16,-12); ctx.lineTo(14,16); ctx.lineTo(-14,16); ctx.fill();
      }
      ctx.restore();
    }

    const bob = Math.sin(player.bob)*2.5;
    ctx.save();
    if (player.hurtCd > 0) ctx.globalAlpha = .7 + Math.sin(performance.now()/40)*.3;
    if (!drawSprite(imgHero, player.x, player.y, 72, bob)) {
      ctx.fillStyle = "#f0d9a8";
      ctx.beginPath(); ctx.moveTo(player.x, player.y-18); ctx.lineTo(player.x+14, player.y+12); ctx.lineTo(player.x-14, player.y+12); ctx.fill();
    }
    ctx.restore();

    if (player.orbit) {
      const ox = player.x + Math.cos(player.orbitA)*52;
      const oy = player.y + Math.sin(player.orbitA)*52;
      ctx.strokeStyle = "rgba(232,160,74,.3)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, 52, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "#e8a04a"; ctx.shadowColor = "#e8a04a"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life*2); ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1;
    }
  }

  function loop(now) {
    const dt = Math.min(.05, (now-last)/1000); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
